<svg xmlns="http://www.w3.org/2000/svg" width="520" height="420" viewBox="0 0 520 420" fill="none"><title>Learning beacon</title><desc>Original abstract beacon above a sequence of three connected learning cards.</desc><defs><linearGradient id="beam" x1="259" y1="64" x2="259" y2="350" gradientUnits="userSpaceOnUse"><stop stop-color="#aa87e6" stop-opacity=".65"/><stop offset="1" stop-color="#aa87e6" stop-opacity="0"/></linearGradient><linearGradient id="core" x1="225" y1="72" x2="295" y2="141"><stop stop-color="#a077e0"/><stop offset="1" stop-color="#5c37a8"/></linearGradient><filter id="shadow" x="-30%" y="-30%" width="170%" height="180%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#51368a" flood-opacity=".12"/></filter></defs><circle cx="262" cy="176" r="157" stroke="#b39bd4" stroke-opacity=".3"/><circle cx="262" cy="176" r="120" stroke="#b39bd4" stroke-opacity=".35"/><circle cx="262" cy="176" r="83" stroke="#b39bd4" stroke-opacity=".4"/><path d="m260 110 154 240H106z" fill="url(#beam)"/><circle cx="260" cy="112" r="47" fill="#e9dffb"/><rect x="227" y="79" width="66" height="66" rx="21" fill="url(#core)" filter="url(#shadow)"/><path d="m260 92 5.5 14.5L280 112l-14.5 5.5L260 132l-5.5-14.5L240 112l14.5-5.5z" fill="#fff"/><path d="M172 199c-62 37-36 76 63 77s157 34 118 68" stroke="#aa8acf" stroke-width="2" stroke-dasharray="4 7"/><g filter="url(#shadow)"><rect x="61" y="178" width="230" height="64" rx="13" fill="#fff"/><rect x="161" y="259" width="255" height="64" rx="13" fill="#fff"/><rect x="94" y="340" width="225" height="57" rx="13" fill="#fff"/></g><rect x="77" y="192" width="35" height="35" rx="10" fill="#e9defa"/><path d="m86 209 6 6 11-12" stroke="#7551b3" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="125" y="204" fill="#3c3051" font-family="system-ui,sans-serif" font-size="12" font-weight="650">Find your starting point</text><text x="125" y="223" fill="#726582" font-family="system-ui,sans-serif" font-size="10">A little clarity goes a long way.</text><rect x="177" y="273" width="35" height="35" rx="10" fill="#e9defa"/><path d="M188 297v-10m7 10v-16m7 16v-6" stroke="#7551b3" stroke-width="2.5" stroke-linecap="round"/><text x="225" y="285" fill="#3c3051" font-family="system-ui,sans-serif" font-size="12" font-weight="650">Build understanding</text><text x="225" y="304" fill="#726582" font-family="system-ui,sans-serif" font-size="10">Learn the why, then give it a try.</text><rect x="109" y="351" width="35" height="35" rx="10" fill="#e9defa"/><path d="M119 375l14-14m-10 0h10v10" stroke="#7551b3" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="157" y="365" fill="#3c3051" font-family="system-ui,sans-serif" font-size="12" font-weight="650">See how far you’ve come</text><text x="157" y="383" fill="#726582" font-family="system-ui,sans-serif" font-size="10">Progress, at your own pace.</text><circle cx="399" cy="120" r="5" fill="#af94d7"/><circle cx="100" cy="126" r="3" fill="#af94d7"/><path d="m428 215 3 7 7 3-7 3-3 7-3-7-7-3 7-3z" fill="#b69bdc"/></svg>
