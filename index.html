function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){alert('Browser storage is unavailable. Export a JSON backup regularly.')}}
function pick(pool,n){let p=[...pool];for(let i=p.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[p[i],p[j]]=[p[j],p[i]]}return p.slice(0,n)}
function nav(){el('nav').innerHTML=['dashboard','study','practice','schedule','results','backup'].map(t=>`<button class="${tab===t?'active':''}" onclick="go('${t}')">${t==='backup'?'Backup / Restore':t[0].toUpperCase()+t.slice(1)}</button>`).join('')}
function go(t){if(session&&!confirm('Leave this test? Your active test will be discarded.'))return;session=null;clearInterval(ticker);tab=t;render()}
function render(){nav();({dashboard,study,practice,schedule,results,backup})[tab]();scrollTo(0,0)}
function historyStats(){let a=data.history.flatMap(x=>x.details),correct=a.filter(x=>x.correct).length;return{total:a.length,accuracy:a.length?Math.round(100*correct/a.length):null}}
function dashboard(){let s=historyStats();let best=SUBJECTS.map(sub=>{let d=data.history.flatMap(x=>x.details).filter(x=>x.subject===sub);return {sub,n:d.length,p:d.length?Math.round(100*d.filter(x=>x.correct).length/d.length):null}}).filter(x=>x.n>=5).sort((a,b)=>a.p-b.p);el('view').innerHTML=`<div class="grid"><div class="panel"><div class="muted">Question bank</div><div class="stat">${QUESTIONS.length}</div><span class="small muted">60 per subject</span></div><div class="panel"><div class="muted">Tests completed</div><div class="stat">${data.history.length}</div></div><div class="panel"><div class="muted">Practice accuracy</div><div class="stat">${s.accuracy??'—'}${s.accuracy===null?'':'%'}</div><span class="small muted">Not an AFQT score</span></div></div><div class="panel"><h2>Your path to a top score</h2><p>Start with a balanced 45-question diagnostic. Preserve your math strengths, then work your lowest-scoring subjects. Study 60–90 minutes, 5–6 days a week.</p><div class="buttons"><button class="primary" onclick="start('diagnostic')">Start diagnostic</button><button onclick="go('schedule')">Six-week study plan</button></div>${best.length?`<h3 style="margin-top:23px">Areas to improve</h3>${best.slice(0,3).map(x=>`<div class="progressnote"><b>${esc(x.sub)}</b> — ${x.p}% across ${x.n} answers<div class="bar"><div style="width:${x.p}%"></div></div></div>`).join('')}`:''}</div><div class="panel notice"><b>Important:</b> This is independently created practice, not official ASVAB content. Your percent correct is not a valid AFQT percentile or military qualification prediction. The real exam's format and length differ. Graphical spatial exercises here focus on rotation of silhouettes.</div>`}
function study(){el('view').innerHTML=`<div class="panel"><h2>Study guide</h2><p>Open each subject for core concepts and practice. Combine these notes with a reputable ASVAB textbook for deeper coverage.</p><button onclick="window.print()">Print study guide</button></div>`+SUBJECTS.map(sub=>`<details class="panel"><summary>${esc(sub)} · 60 practice questions</summary><ul class="lessonText">${LESSONS[sub].map(x=>`<li>${esc(x)}</li>`).join('')}</ul>${sub==='Assembling Objects'?'<p>Rotate the target mentally. Turning is allowed, mirror-flipping is not. Compare relative positions of each square.</p>':''}<button onclick="start('subject','${esc(sub).replace(/'/g,'&#39;')}')">Practice ${esc(sub)}</button></details>`).join('')}
function practice(){el('view').innerHTML=`<div class="panel"><h2>Practice center</h2><div class="grid"><div><h3>Diagnostic</h3><p>45 questions, 5 from each of 9 subjects. Untimed.</p><button class="primary" onclick="start('diagnostic')">Start diagnostic</button></div><div><h3>Timed mixed test</h3><p>90 questions, 90 minutes, 10 from each subject.</p><button class="primary" onclick="start('mixed')">Start 90-question test</button></div><div><h3>AFQT focused</h3><p>40 questions, 40 minutes. Arithmetic, math, vocabulary, reading.</p><button class="primary" onclick="start('afqt')">Start AFQT practice</button></div><div><h3>Missed-question review</h3><p>Retry saved missed items from previous tests.</p><button onclick="start('missed')" ${data.missed.length?'':'disabled'}>Review missed (${data.missed.length})</button></div></div></div><div class="panel"><h3>Targeted subject drill</h3><div class="flex"><select id="subj" aria-label="Choose subject">${SUBJECTS.map(s=>`<option>${esc(s)}</option>`).join('')}</select><button onclick="start('subject',el('subj').value)">Start 20-question drill</button></div></div>`}
function start(mode,sub){clearInterval(ticker);let bank=[];if(mode==='diagnostic')bank=SUBJECTS.flatMap(s=>pick(QUESTIONS.filter(q=>q.subject===s),5));else if(mode==='mixed')bank=SUBJECTS.flatMap(s=>pick(QUESTIONS.filter(q=>q.subject===s),10));else if(mode==='afqt')bank=AFQT.flatMap(s=>pick(QUESTIONS.filter(q=>q.subject===s),10));else if(mode==='missed')bank=pick(QUESTIONS.filter(q=>data.missed.includes(q.id)),Math.min(data.missed.length,30));else bank=pick(QUESTIONS.filter(q=>q.subject===sub),20);if(!bank.length){alert('No questions available.');return}session={mode,sub:sub||'',ids:pick(bank,bank.length).map(q=>q.id),answers:Array(bank.length).fill(null),i:0,end:mode==='mixed'?Date.now()+90*60000:mode==='afqt'?Date.now()+40*60000:null};tab='practice';nav();showQ();if(session.end){ticker=setInterval(()=>{if(!session)return;let left=Math.max(0,Math.ceil((session.end-Date.now())/1000));if(el('clock'))el('clock').textContent=`${Math.floor(left/60)}:${String(left%60).padStart(2,'0')} remaining`;if(!left)finish()},500)}}
function shapeSVG(c){const w=Math.max(...c.map(x=>x[0]))+1,h=Math.max(...c.map(x=>x[1]))+1;let cell=Math.min(22,95/Math.max(w,h)),dx=(125-w*cell)/2,dy=(96-h*cell)/2;return `<svg class="visual" viewBox="0 0 125 96" role="img" aria-label="Geometric block silhouette"><title>Block silhouette</title>${c.map(([x,y])=>`<rect x="${dx+x*cell}" y="${dy+y*cell}" width="${cell}" height="${cell}" rx="1" fill="#70cbf5" stroke="#0f426a" stroke-width="1"/>`).join('')}</svg>`}
function showQ(){if(!session)return;let x=session,i=x.i,q=QUESTIONS.find(v=>v.id===x.ids[i]);let spatial=!!q.visual;el('view').innerHTML=`<div class="panel"><div class="flex between"><b>${esc(x.mode.toUpperCase())}</b><span class="muted">Question ${i+1} / ${x.ids.length}</span><span class="warning" id="clock"></span></div><div class="bar" style="margin:16px 0"><div style="width:${(i+1)*100/x.ids.length}%"></div></div><div class="muted">${esc(q.subject)}</div><p class="question">${esc(q.q)}</p>${spatial?`<div class="muted small">Target silhouette</div><div class="target">${shapeSVG(q.visual.target)}</div>`:''}<div class="${spatial?'spatial-options':''}">${q.options.map((o,j)=>`<button class="opt ${x.answers[i]===j?'selected':''}" onclick="choose(${j})" aria-pressed="${x.answers[i]===j}"><span class="letter">${'ABCD'[j]}</span>${spatial?shapeSVG(q.visual.options[j]):`<span>${esc(o)}</span>`}</button>`).join('')}</div><div class="buttons" style="margin-top:20px"><button onclick="step(-1)" ${i?'':'disabled'}>← Previous</button><button onclick="step(1)" ${i===x.ids.length-1?'disabled':''}>Next →</button><button class="primary" onclick="finishConfirm()">Submit test</button></div><p class="small muted">Answered ${x.answers.filter(a=>a!==null).length} of ${x.ids.length}. Unanswered items count as incorrect.</p></div>`;tick()}
function tick(){if(session?.end&&el('clock')){let left=Math.max(0,Math.ceil((session.end-Date.now())/1000));el('clock').textContent=`${Math.floor(left/60)}:${String(left%60).padStart(2,'0')} remaining`}}
function choose(j){session.answers[session.i]=j;showQ()}function step(n){session.i=Math.min(session.ids.length-1,Math.max(0,session.i+n));showQ()}
function finishConfirm(){let n=session.answers.filter(a=>a===null).length;if(!n||confirm(`You have ${n} unanswered questions. Submit now?`))finish()}
function finish(){if(!session)return;clearInterval(ticker);let x=session,details=x.ids.map((id,i)=>{let q=QUESTIONS.find(z=>z.id===id);return{id,subject:q.subject,q:q.q,options:q.options,answer:q.answer,chosen:x.answers[i],correct:x.answers[i]===q.answer,explanation:q.explanation,visual:q.visual}});let missed=new Set(data.missed);for(let d of details){if(d.correct)missed.delete(d.id);else missed.add(d.id)}data.missed=[...missed];data.history.unshift({date:new Date().toISOString(),mode:x.mode,sub:x.sub,details});data.viewIndex=0;save();session=null;tab='results';render()}
function results(){if(!data.history.length){el('view').innerHTML='<div class="panel"><h2>Your results</h2><p>No tests completed. Start a diagnostic to get a personalized baseline.</p><button onclick="go(\'practice\')">Go to practice</button></div>';return}const id=Math.min(data.viewIndex||0,data.history.length-1),r=data.history[id],correct=r.details.filter(d=>d.correct).length,pct=Math.round(100*correct/r.details.length);let subs=[...new Set(r.details.map(d=>d.subject))];el('view').innerHTML=`<div class="panel"><h2>Exam result: ${pct}%</h2><p>${correct} / ${r.details.length} correct · ${esc(r.mode)} · ${new Date(r.date).toLocaleString()}</p><div class="notice small">Practice accuracy only—this is not an official AFQT score.</div><h3>Subject breakdown</h3><div class="grid">${subs.map(s=>{let a=r.details.filter(x=>x.subject===s),n=a.filter(x=>x.correct).length,p=Math.round(100*n/a.length);return `<div><b>${esc(s)}</b><p>${n}/${a.length} · ${p}%</p><div class="bar"><div style="width:${p}%"></div></div></div>`}).join('')}</div></div><div class="panel"><h2>Answer review</h2>${r.details.map((d,i)=>`<details><summary><span class="${d.correct?'good':'bad'}">${d.correct?'✓':'✗'}</span> ${i+1}. ${esc(d.subject)} — ${esc(d.q.split('\n').pop().slice(0,85))}</summary><p class="question">${esc(d.q)}</p>${d.visual?`<div class="target">${shapeSVG(d.visual.target)}</div><div class="spatial-options">${d.visual.options.map((s,j)=>`<div><b>${'ABCD'[j]}${j===d.answer?' ✓':''}</b>${shapeSVG(s)}</div>`).join('')}</div>`:''}<p>Your answer: <b>${d.chosen===null?'Unanswered':esc(d.options[d.chosen])}</b></p><p class="good">Correct answer: ${esc(d.options[d.answer])}</p><p>${esc(d.explanation)}</p></details>`).join('')}</div><div class="panel"><h2>History</h2>${data.history.slice(0,40).map((r,i)=>`<p><button onclick="data.viewIndex=${i};results()">View</button> ${esc(r.mode)} · ${new Date(r.date).toLocaleDateString()} · ${r.details.filter(x=>x.correct).length}/${r.details.length}</p>`).join('')}</div>`}
function schedule(){el('view').innerHTML=`<div class="panel"><h2>Flexible six-week plan</h2><p>No deadline yet: complete the plan once, then repeat Weeks 5–6 while targeting weak sections. Target 60–90 minutes a day, 5–6 days a week.</p><p><b>Daily routine:</b> 10 minutes vocabulary · 20 minutes lesson · 25–40 minutes practice · 10–20 minutes error review.</p><label>Current week: <select onchange="data.week=Number(this.value);save();schedule()">${WEEKS.map((w,i)=>`<option value="${i+1}" ${data.week===i+1?'selected':''}>Week ${i+1}</option>`).join('')}</select></label></div>${WEEKS.map((w,i)=>`<div class="panel"><h3>${data.week===i+1?'▶ ':''}Week ${i+1}: ${w[0]}</h3><p>${w[1]}</p><p class="muted small">Mon–Thu: lessons and drills · Fri: timed test · Sat: correct errors · Sun: rest.</p></div>`).join('')}`}
function exportData(){let blob=new Blob([JSON.stringify({app:'ASVAB Prep Pro V3',version:3,...data},null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ASVAB_Prep_Pro_V3_backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
function importData(input){let f=input.files?.[0];if(!f)return;let rd=new FileReader();rd.onload=()=>{try{let obj=JSON.parse(rd.result);if(!Array.isArray(obj.history)||!Array.isArray(obj.missed))throw new Error('Invalid V3 backup');if(!confirm('Replace existing progress with this backup?'))return;data={history:obj.history,missed:obj.missed,week:obj.week||1};save();alert('Backup restored.');render()}catch(e){alert('Unable to import: '+e.message)}};rd.readAsText(f)}
function resetData(){if(confirm('Delete all locally stored results and missed questions? Export a backup first.')){data={history:[],week:1,missed:[]};save();render()}}
function backup(){el('view').innerHTML=`<div class="panel"><h2>Backup and restore</h2><p>Progress is stored <b>only on this device and browser</b>. It does not automatically sync between an iPad and Windows laptop. Export a backup to move your scores between devices or protect against browser cleanup.</p><div class="buttons"><button class="primary" onclick="exportData()">Download progress backup</button><label>Restore backup: <input class="fileinput" type="file" accept=".json,application/json" onchange="importData(this)"></label></div></div><div class="panel"><h3>Privacy and offline use</h3><p>This file makes no external requests. Question bank, lessons, and test logic are embedded in the HTML. Once saved, it works offline in a compatible browser.</p><p class="small muted">On iPad, local HTML files may open as previews; a static website gives the most reliable Safari experience. The app does not yet have cloud accounts or cross-device syncing.</p><button onclick="resetData()">Clear progress on this device</button></div>`}
render();
</script></body></html>
